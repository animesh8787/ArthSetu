name: Scheduled sync

# Pulls every configured connector, matches new records and refreshes statuses by
# calling POST /api/v1/cron/tick. Inert until the repository has the variable
# BACKEND_URL and the secret CRON_SECRET (the same value as CRON_SECRET on the backend).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Trigger the sync
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          # A free-tier backend can take ~50 s to wake, so allow for it and retry once.
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 20 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" "$BACKEND_URL/api/v1/cron/tick"
