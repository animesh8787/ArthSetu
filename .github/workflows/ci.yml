name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (SQLite - pytest, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify migrations build a clean schema
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests
        run: python -m pytest

  backend-postgres:
    name: Backend (PostgreSQL - migrations, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arthsetu
          POSTGRES_PASSWORD: arthsetu
          POSTGRES_DB: arthsetu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arthsetu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arthsetu:arthsetu@localhost:5432/arthsetu_test
      # SQLite has no foreign-key enforcement or native types; this job catches what it hides.
      ARTHSETU_TEST_DATABASE_URL: postgresql://arthsetu:arthsetu@localhost:5432/arthsetu_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Migrate, check for drift, and round-trip a downgrade
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t arthsetu-backend .
      - run: docker build -f frontend/Dockerfile -t arthsetu-frontend .
