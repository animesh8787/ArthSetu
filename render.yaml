# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> pick this repo.
#
# Free-tier friendly on purpose: `plan: free` needs no card at all, and
# Render's own Postgres is deliberately NOT used here — Render requires a
# payment method on file for any database, even a free one. Bring your own
# free Postgres instead (Neon, Supabase — neither requires a card for their
# free tier) and paste its connection string in when Render prompts for
# DATABASE_URL during the Blueprint setup (it has no `value`/`generateValue`
# below, so Render asks for it interactively rather than trying to
# provision one itself). See Docs/API_CONTRACT.md for the full walkthrough.
#
# CORS_ORIGINS below is set to this project's Vercel URL - change it if yours
# differs - and BOOTSTRAP_ADMIN_PASSWORD's generated value has to
# be read from the dashboard after first deploy. FIREBASE_CREDENTIALS_JSON,
# FIREBASE_PROJECT_ID and BOOTSTRAP_ADMIN_EMAIL all need a Firebase project
# to exist first (Docs/API_CONTRACT.md, "Deploying to Vercel + Render").
#
# Free plan caveat: the service spins down after ~15 min idle and takes
# ~50s to wake on the next request. Fine for a demo; upgrade to a paid
# plan (and switch DATABASE_URL back to `fromDatabase` + a `databases:`
# block, card required) for anything that needs to stay warm.

services:
  - type: web
    name: arthsetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false # paste the full contents of your Firebase service-account JSON here
      - key: FIREBASE_PROJECT_ID
        sync: false # your Firebase project id
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false # a real mailbox you control — this becomes the first admin login
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: CRON_SECRET
        sync: false # optional: enables POST /api/v1/cron/tick for the scheduled sync workflow
      - key: CORS_ORIGINS
        value: https://arth-setu-six.vercel.app
      - key: WEB_CONCURRENCY
        value: "1"
